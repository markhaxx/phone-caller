<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 280px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
      margin: 0;
    }
    
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #e1e1e1;
    }
    
    .header h1 {
      margin: 0;
      font-size: 16px;
      font-weight: 600;
      color: #333;
    }
    
    .section {
      margin-bottom: 16px;
    }
    
    .section-title {
      font-weight: 600;
      margin-bottom: 8px;
      color: #333;
    }
    
    .country-select {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
      background: white;
      box-sizing: border-box;
    }
    
    .country-status {
      font-size: 12px;
      color: #28a745;
      margin-top: 4px;
      min-height: 16px;
    }
    
    .info-section {
      background: #f8f9fa;
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 16px;
    }
    
    .info-text {
      font-size: 13px;
      color: #666;
      line-height: 1.4;
    }
    
    .test-section {
      border-top: 1px solid #e1e1e1;
      padding-top: 16px;
    }
    
    .test-input {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
      margin-bottom: 8px;
      box-sizing: border-box;
    }
    
    .test-button {
      background: #28a745;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      width: 100%;
    }
    
    .test-button:hover:not(:disabled) {
      background: #218838;
    }
    
    .test-button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    
    .status {
      margin-top: 8px;
      padding: 6px 8px;
      border-radius: 4px;
      font-size: 12px;
      text-align: center;
    }
    
    .status.success {
      background: #d4edda;
      color: #155724;
    }
    
    .status.error {
      background: #f8d7da;
      color: #721c24;
    }
  </style>
</head>
<body>
  <div class="header">
    <span style="font-size: 20px;">📞</span>
    <h1>Phone Caller</h1>
  </div>
  
  <div class="section">
    <div class="section-title">Default Country Code:</div>
    <select id="countryCode" class="country-select">
      <option value="+1">🇺🇸 United States / Canada (+1)</option>
      <option value="+44">🇬🇧 United Kingdom (+44)</option>
      <option value="+33">🇫🇷 France (+33)</option>
      <option value="+49">🇩🇪 Germany (+49)</option>
      <option value="+39">🇮🇹 Italy (+39)</option>
      <option value="+34">🇪🇸 Spain (+34)</option>
      <option value="+31">🇳🇱 Netherlands (+31)</option>
      <option value="+32">🇧🇪 Belgium (+32)</option>
      <option value="+41">🇨🇭 Switzerland (+41)</option>
      <option value="+43">🇦🇹 Austria (+43)</option>
      <option value="+45">🇩🇰 Denmark (+45)</option>
      <option value="+46">🇸🇪 Sweden (+46)</option>
      <option value="+47">🇳🇴 Norway (+47)</option>
      <option value="+358">🇫🇮 Finland (+358)</option>
      <option value="+351">🇵🇹 Portugal (+351)</option>
      <option value="+353">🇮🇪 Ireland (+353)</option>
      <option value="+48">🇵🇱 Poland (+48)</option>
      <option value="+420">🇨🇿 Czech Republic (+420)</option>
      <option value="+36">🇭🇺 Hungary (+36)</option>
      <option value="+30">🇬🇷 Greece (+30)</option>
      <option value="+90">🇹🇷 Turkey (+90)</option>
      <option value="+7">🇷🇺 Russia (+7)</option>
      <option value="+86">🇨🇳 China (+86)</option>
      <option value="+81">🇯🇵 Japan (+81)</option>
      <option value="+82">🇰🇷 South Korea (+82)</option>
      <option value="+91">🇮🇳 India (+91)</option>
      <option value="+61">🇦🇺 Australia (+61)</option>
      <option value="+64">🇳🇿 New Zealand (+64)</option>
      <option value="+55">🇧🇷 Brazil (+55)</option>
      <option value="+52">🇲🇽 Mexico (+52)</option>
      <option value="+54">🇦🇷 Argentina (+54)</option>
      <option value="+27">🇿🇦 South Africa (+27)</option>
      <option value="+972">🇮🇱 Israel (+972)</option>
      <option value="+971">🇦🇪 UAE (+971)</option>
      <option value="+966">🇸🇦 Saudi Arabia (+966)</option>
    </select>
    <div id="countryStatus" class="country-status"></div>
  </div>
  
  <div class="info-section">
    <div class="info-text">Select any phone number on a webpage and right-click to call. Numbers without country code will use your selected default.</div>
  </div>
  
  <div class="test-section">
    <div class="section-title">Test a number:</div>
    <input type="text" id="testNumber" class="test-input" placeholder="Enter phone number">
    <button id="testCall" class="test-button">Test Call</button>
    <div id="status" class="status" style="display: none;"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
